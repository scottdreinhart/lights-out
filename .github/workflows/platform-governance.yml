name: platform-governance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  platform-governance:
    runs-on: ubuntu-latest
    env:
      ENFORCE_INSTRUCTION_BASELINE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run platform governance checks
        run: bash ci/platform-governance-check.sh

      - name: Validate Script Standards
        run: bash scripts/validate-script-standards.sh
