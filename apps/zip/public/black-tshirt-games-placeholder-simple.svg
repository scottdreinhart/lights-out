<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title>Black T Shirt Games simple placeholder</title>
  <desc>Balanced placeholder mockup with a clean black t-shirt silhouette on a dark background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#121212" />
      <stop offset="100%" stop-color="#090909" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#050505" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" />

  <g transform="translate(260 140)" filter="url(#shadow)">
    <path
      d="M220 122 L290 70 H410 L480 122 L620 204 L572 326 L500 286 V812 H100 V286 L28 326 L-20 204 Z"
      fill="url(#shirt)"
      stroke="#2b2b2b"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <path d="M290 70 C300 94 322 118 350 118 C378 118 400 94 410 70" fill="none" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round" />
    <path d="M260 272 H440" stroke="#f0c35a" stroke-opacity="0.28" stroke-width="14" stroke-linecap="round" />
    <path d="M305 352 H395" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8" stroke-linecap="round" />
    <path d="M305 404 H415" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" stroke-linecap="round" />
    <path d="M305 456 H385" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" stroke-linecap="round" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="1000" font-size="60" letter-spacing="9" font-weight="800" fill="#f4f0e7">BLACK T SHIRT GAMES</text>
  </g>
</svg>
