<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title>Black T Shirt Games placeholder</title>
  <desc>Minimal placeholder mockup for Black T Shirt Games with a black t-shirt icon and simple typography.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#151515" />
      <stop offset="100%" stop-color="#0d0d0d" />
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1f1f1f" />
      <stop offset="100%" stop-color="#141414" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5c76b" />
      <stop offset="100%" stop-color="#d89225" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" />

  <rect x="160" y="140" width="880" height="920" rx="64" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.06" />

  <g transform="translate(308 194)" filter="url(#shadow)">
    <path
      d="M192 108 L275 58 H395 L478 108 L585 172 L534 287 L474 255 V780 H120 V255 L60 287 L9 172 Z"
      fill="#080808"
      stroke="#f5c76b"
      stroke-opacity="0.22"
      stroke-width="6"
      stroke-linejoin="round"
    />
    <path d="M275 58 C286 89 319 112 335 112 C351 112 384 89 395 58" fill="none" stroke="#f5c76b" stroke-opacity="0.22" stroke-width="8" stroke-linecap="round" />
    <path d="M214 280 H377" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="900" font-size="56" letter-spacing="8" font-weight="700" fill="#f4efe4">BLACK T SHIRT</text>
    <text x="600" y="980" font-size="92" letter-spacing="14" font-weight="900" fill="#ffffff">GAMES</text>
    <text x="600" y="1042" font-size="28" letter-spacing="7" fill="#c9c1b4">PLACEHOLDER IMAGE</text>
  </g>
</svg>
