<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title>Black T Shirt Games square placeholder</title>
  <desc>Square placeholder mockup with a centered black t-shirt silhouette and title.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111111" />
      <stop offset="100%" stop-color="#0b0b0b" />
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1a1a1a" />
      <stop offset="100%" stop-color="#121212" />
    </linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#101010" />
      <stop offset="100%" stop-color="#060606" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="22" flood-color="#000000" flood-opacity="0.42" />
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bg)" />
  <rect x="145" y="145" width="910" height="910" rx="52" fill="url(#panel)" stroke="#ffffff" stroke-opacity="0.06" />

  <g transform="translate(270 195)" filter="url(#shadow)">
    <path
      d="M210 118 L286 66 H414 L490 118 L610 190 L566 316 L506 282 V776 H94 V282 L34 316 L-10 190 Z"
      fill="url(#shirt)"
      stroke="#2d2d2d"
      stroke-width="5"
      stroke-linejoin="round"
    />
    <path d="M286 66 C296 92 321 116 350 116 C379 116 404 92 414 66" fill="none" stroke="#3a3a3a" stroke-width="8" stroke-linecap="round" />
    <path d="M252 260 H448" stroke="#f3c55f" stroke-opacity="0.28" stroke-width="14" stroke-linecap="round" />
    <path d="M314 364 H386" stroke="#ffffff" stroke-opacity="0.08" stroke-width="8" stroke-linecap="round" />
    <path d="M314 416 H402" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" stroke-linecap="round" />
    <path d="M314 468 H376" stroke="#ffffff" stroke-opacity="0.06" stroke-width="8" stroke-linecap="round" />
  </g>

  <g font-family="Arial, Helvetica, sans-serif" text-anchor="middle">
    <text x="600" y="940" font-size="54" letter-spacing="7" font-weight="800" fill="#f4f0e7">BLACK T SHIRT GAMES</text>
    <text x="600" y="998" font-size="28" letter-spacing="5" fill="#c5bfb4">PLACEHOLDER IMAGE</text>
  </g>
</svg>
